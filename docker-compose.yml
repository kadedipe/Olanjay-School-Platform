services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: olanjay
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: ["olanjay_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d olanjay"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  olanjay_pg:
